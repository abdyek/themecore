[[layouts]]
id = "post"
source = '''
~ body = NO_MATTER cover = IMAGE
{{ HEADER content = TOP }}
{{ MAIN content = BODY }}
{{ FOOTER content = BOTTOM }}

~ TOP
{{ NAV content = MENU }}

~ MENU
{{ LIST items = [] item = ITEM }}

~ BODY
{{ ARTICLE content = TEXT }}
{{ ASIDE content = TEXT }}

~ TEXT
{{ DETAILS text = "x" content = BOTTOM }}

~ BOTTOM
b
'''

